<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='Профиль')"></head>

<body>

    <header th:insert="fragments.html :: header"></header>

    <section class="hero">
        <div class="container">
            <h2>Профиль</h2>
            <p>Информация о вашем аккаунте на форуме</p>
        </div>
    </section>

    <div class="container">
        <section class="profile-card">
            <div class="profile-card__avatar" aria-hidden="true">
                <i class="fas fa-user"></i>
            </div>
            <dl class="profile-card__info">
                <div class="profile-card__row">
                    <dt>Имя пользователя</dt>
                    <dd th:text="${username}">igor_dev</dd>
                </div>
                <div class="profile-card__row">
                    <dt>Дата регистрации</dt>
                    <dd th:text="${registration_date}">15 января 2026</dd>
                </div>
                <div class="profile-card__row">
                    <dt>Роль</dt>
                    <dd>
                        <span th:if="${#lists.contains(roles, 'USER')}" class="profile-card__role_user">Пользователь</span>
                        <span th:if="${#lists.contains(roles, 'MODERATOR')}" class="profile-card__role_moderator">Модератор</span>
                        <span th:if="${#lists.contains(roles, 'BANNED')}" class="profile-card__role_banned">Забанен</span>
                    </dd>
                </div>
            </dl>
        </section>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>
