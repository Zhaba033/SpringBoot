<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='Создать категорию')"></head>

<body>

    <header th:insert="fragments.html :: header"></header>

    <section class="hero">
        <div class="container">
            <h2>Создание новой категории</h2>
            <p>Добавьте новый раздел, чтобы структурировать обсуждения сообщества</p>
        </div>
    </section>

    <div th:insert="fragments.html :: banned(text='Вы не можете создавать категории, будучи в бане.')"></div>

    <div th:insert="fragments.html :: register(text='Чтобы создавать категории.')"></div>

    <div sec:authorize="hasRole('ROLE_USER')" class="container">
        <form class="topic-form category-form" th:action="@{/moderator/new-category/create}" method="POST">
            <div class="form-group">
                <label for="category_id">Идентификатор категории</label>
                <input type="text" id="category_id" name="category_id" class="category-id-input"
                    placeholder="Например: backend-java" required>
                <span th:if="${alreadyExists!=null}" style="color: red;" class="form-hint">Категория с ID <strong
                        th:text="${alreadyExists}"></strong> уже существует!</span>
                <span th:if="${alreadyExists==null}" class="form-hint">Используйте короткий уникальный идентификатор
                    латиницей.</span>
            </div>

            <div class="form-group">
                <label for="category_name">Название категории</label>
                <input type="text" name="name" placeholder="Например: Java & Spring" required>
            </div>

            <div class="form-group">
                <label for="category_description">Описание категории</label>
                <textarea id="description" name="description" rows="6"
                    placeholder="Опишите, какие темы обсуждаются в этой категории и для кого она предназначена."
                    required></textarea>
            </div>

            <div class="form-actions">
                <button type="reset" class="btn-secondary">Очистить</button>
                <button type="submit" class="btn-secondary">Создать категорию</button>
            </div>
        </form>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>
