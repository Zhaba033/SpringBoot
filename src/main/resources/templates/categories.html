<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='Категории')"></head>

<body>

    <header th:insert="fragments.html :: header"></header>

    <section class="hero">
        <div class="container">
            <h2>Категории форума</h2>
            <p>Выберите интересующий вас раздел</p>
        </div>
    </section>

    <div class="container">
        <div class="categories-page">
            <div th:if="${#maps.size(categories)==0}" class="categories-empty-notice">
                <p class="empty-notice-title">Категорий пока нет</p>
                <a href="\new-category" class="create-category-btn">Создать категорию</a>
            </div>
            <a th:if="${#maps.size(categories)!=0}" th:each="category : ${categories}"
                th:href="@{'/categories/'+${category.key}}" href="/categories/test" class="category-item">
                <div class="category-content">
                    <h3 th:text="${category.value.name}">Название</h3>
                    <p th:text="${category.value.description}">Описание</p>
                    <div class="category-meta">
                        <span class="posts"><i class="far fa-comment-dots"></i>Публикаций:
                            <span
                                th:text="${category.value.posts != null ? #lists.size(category.value.posts) : 0}">0</span>
                        </span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>

</html>
