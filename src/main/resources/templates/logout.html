<!DOCTYPE html>
<html lang="ru">

    <head th:replace="fragments.html :: head(title='Выход из аккаунта')"></head>

    <body>

        <header th:insert="fragments.html :: header"></header>

        <section class="hero">
            <div class="container">
                <h2>Выход из аккаунта</h2>
                <p>Подтвердите действие, чтобы завершить текущую сессию</p>
            </div>
        </section>

        <div class="container">
            <section class="logout-card">
                <p class="logout-card__label">Пользователь:</p>
                <p th:text="${username}" class="logout-card__username">igor_dev</p>
                <p class="logout-card__question">Вы уверены, что хотите выйти из аккаунта?</p>

                <div class="logout-card__actions">
                    <form th:action="@{/logout}" method="POST">
                        <button type="submit" class="btn-primary logout-card__btn">Выйти</button>
                    </form>
                    <form th:action="@{/}" method="GET">
                        <button type="submit" class="btn-secondary logout-card__btn">Отмена</button>
                    </form>
                </div>
            </section>
        </div>

        <footer th:insert="fragments.html :: footer"></footer>
    </body>

</html>
