<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='ITForum - Главная')"></head>

<body>

    <header th:insert="fragments.html :: header"></header>

    <section class="hero hero-home">
        <div class="container">
            <h2>Открыть тему по номеру</h2>

            <div class="search-section">

                <form class="search-bar search-bar--home" action="/" method="POST">
                    <label class="visually-hidden" for="post-id-search">Номер поста</label>
                    <input name="id" type="text" placeholder="Введите номер поста" inputmode="numeric"
                        autocomplete="off">
                    <button type="submit">Найти</button>
                </form>

                <p th:if="${PostNE}" style="color: red; margin-top: 5px;" class="search-error">Поста с номером <strong th:text="${PostNE}"></strong> не
                    существует!</p>
            </div>
        </div>
    </section>

    <div class="container">
        <div class="home-actions">
            <a href="/theme" class="home-action">Создать новую тему</a>
            <a href="/new-category" class="home-action">Создать новую категорию</a>
        </div>
    </div>

    <section class="recent-posts">
            <h2 class="recent-posts__title">
                <i class="fas fa-clock" style="color: #2563eb;"></i> Последние посты
            </h2>
            <ul class="publication-list">

                <li th:each="post : ${posts}" class="moderable-item">
                    <a th:href="@{/post/} + ${post.id}" href="#" class="publication-preview">
                        <div class="publication-preview-main">
                            <span th:text="'#' + ${post.id}" class="publication-id">#1842</span>
                            <span th:text="${post.title}" class="publication-title">Титле</span>
                            <p th:text="${post.body}" class="publication-excerpt">Описание</p>
                            <span th:text="'Категория: ' + ${post.category}" class="publication-category">Категория</span>
                        </div>
                        <div class="publication-preview-meta">
                            <span th:text="${post.timeFromNow}" class="publication-age">
                                <i class="far fa-clock"></i> 2 часа назад
                            </span>
                            <span th:text="'Комментариев: ' + ${#maps.size(post.comments)}" class="publication-comments">
                                <i class="far fa-comment"></i> 23 комментария
                            </span>
                        </div>
                        <form th:replace="fragments.html :: delete(path=@{/moderator/post/} + ${post.id} + @{/delete/home})"></form>
                    </a>
                </li>
            </ul>
        </section>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>
