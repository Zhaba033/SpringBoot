<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='ITForum - Главная')"></head>

<body>

    <header th:insert="fragments.html :: header"></header>

    <section class="hero hero-home">
        <div class="container">
            <h2>Открыть тему по номеру</h2>

            <div class="search-section">

                <form class="search-bar search-bar--home" action="/" method="POST">
                    <label class="visually-hidden" for="post-id-search">Номер поста</label>
                    <input name="id" type="text" placeholder="Введите номер поста" inputmode="numeric"
                        autocomplete="off">
                    <button type="submit">Найти</button>
                </form>

                <p th:if="${PostNE}" style="color: red; margin-top: 5px;" class="search-error">Поста с номером <strong th:text="${PostNE}"></strong> не
                    существует!</p>
            </div>
        </div>
    </section>

    <div class="container">
        <div class="home-actions">
            <a href="/theme" class="home-action">Создать новую тему</a>
            <a href="/new-category" class="home-action">Создать новую категорию</a>
        </div>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>
