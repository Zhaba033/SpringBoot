<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='Результат действия')"></head>

<body>

    <header th:insert="fragments.html :: header"></header>


    <div class="container">
        <div class="result-page">

            <section th:if="${code}=='200'" class="result-card result-card--success">
                <span class="result-card__icon" aria-hidden="true"><i class="fas fa-check-circle"></i></span>
                <h1 class="result-card__title">Успешно!</h1>
                <p th:text="${text}" class="result-card__text"></p>
            </section>

            <section th:if="${code}=='300'" class="result-card result-card--changed">
                <span class="result-card__icon" aria-hidden="true"><i class="fas fa-pen-square"></i></span>
                <h1 class="result-card__title">Действие выполнено с изменениями</h1>
                <p class="result-card__text">Операция завершена, но часть данных была изменена или дополнена. Проверьте результат перед продолжением работы.</p>

            </section>

            <section th:if="${code}=='400'" class="result-card result-card--error">
                <span class="result-card__icon" aria-hidden="true"><i class="fas fa-times-circle"></i></span>
                <h1 class="result-card__title">Ошибка.</h1>
                <p class="result-card__text">Не удалось завершить операцию. Попробуйте ещё раз или вернитесь на главную страницу.</p>
            </section>

        </div>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>
