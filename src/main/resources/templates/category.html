<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='Категория: ' + ${category.name})"></head>

<body>


    <header th:insert="fragments.html :: header"></header>

    <section class="hero">
        <div class="container">
            <p class="hero-breadcrumb">
                <a href="/categories" th:href="@{/categories}"><i class="fas fa-arrow-left"></i> Все категории</a>
            </p>
            <h2 th:text="${category.name}">AI & Data Science</h2>
            <p th:text="${category.description}">Машинное обучение, нейросети, анализ данных и большие языковые модели
            </p>
        </div>
    </section>

    <div class="container">
        <div class="category-view">
            <h3 class="category-view-heading">Публикации в разделе</h3>
            <ul class="publication-list">
                <li th:each="post : ${posts}" class="moderable-item">
                    <a th:href="@{'/post/' + ${post.key}}" href="#" class="publication-preview">
                        <div class="publication-preview-main">
                            <span th:text="'#'+${post.key}" class="publication-id">#1842</span>
                            <span th:text="${post.value.title}" class="publication-title">Заголовок</span>
                            <p th:text="${post.value.short_desc}" class="publication-excerpt">Краткое описание</p>
                        </div>
                        <div class="publication-preview-meta">
                            <span class="publication-age" title="Пример относительного времени"
                                th:text="${post.value.timeFromNow}"><i class="far fa-clock"></i>
                            </span>
                            
                            <span
                                th:text="'Комментариев: ' + ${#maps.size(post.value.comments)}"
                                class="publication-comments"> 23 комментария
                            </span>
                        </div>
                    </a>
                    <form th:if="${#lists.contains(roles, 'MODERATOR')}" class="mod-delete" method="post" th:action="@{/moderator/post/} + ${post.key} + @{/delete}">
                        <input type="hidden" name="id" value="1842">
                        <button type="submit" class="mod-delete__btn" title="Удалить пост" aria-label="Удалить пост">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>
