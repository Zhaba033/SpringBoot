<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='Вход')"></head>

<body>

    <header th:insert="fragments.html :: header"></header>

    <section class="hero">
        <div class="container">
            <h2>Вход в аккаунт</h2>
        </div>
    </section>

    <div class="container">
        <form class="auth-form" th:action="@{/auth/perform_login}" method="POST">
            <div class="form-group">
                <label for="login-username">Имя пользователя</label>
                <input type="text" id="login-username" name="username" placeholder="Ваш логин" required>
            </div>

            <div class="form-group">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" name="password" placeholder="Введите пароль" required>
                <span th:if="${param.error}" class="error">Неверное имя пользователя или пароль.</span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Войти</button>
            </div>

            <p class="auth-form__switch">
                Нет аккаунта? <a href="/auth/register">Зарегистрироваться</a>
            </p>
        </form>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>
