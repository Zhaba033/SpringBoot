<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='Смена пароля')"></head>

<body>

    <header th:insert="fragments.html :: header"></header>


    <div class="site-wrapper">
        <div th:insert="fragments.html :: breadcrumbs(list=${breadcrumbs})"></div>

        <section class="hero">
            <div class="container">
                <h2>Сменить пароль</h2>
            </div>
        </section>


        <form class="auth-form" th:action="@{/account/change-password/confirm}" method="POST">

            <div class="form-group">
                <label for="login-password">Создайте новый пароль</label>
                <input type="password" name="password" placeholder="" required>
            </div>

            <div class="form-group">
                <label for="login-password">Введите его ещё раз</label>
                <input type="password" name="password_repeat" placeholder="" required>
                <span th:if="${error=='true'}" class="error">Пароли должны совпадать</span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Изменить</button>
            </div>
        </form>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>
