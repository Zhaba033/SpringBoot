<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='Профиль')"></head>

<body>

    <header th:insert="fragments.html :: header"></header>


    <div class="site-wrapper">
        <div th:insert="fragments.html :: breadcrumbs(list=${breadcrumbs})"></div>

        <section class="hero">
            <div class="container">
                <h2>Профиль</h2>
                <p>Информация о вашем аккаунте на форуме</p>
            </div>
        </section>

        <div sec:authorize="!isAuthenticated()" th:insert="fragments.html :: register(text='Нет информации о вашем аккаунте.')"></div>


        <section sec:authorize="isAuthenticated()" class="profile-card">
            <div class="profile-card__avatar" aria-hidden="true">
                <i class="fas fa-user"></i>
            </div>
            <dl class="profile-card__info">
                <div class="profile-card__row">
                    <dt>Имя пользователя</dt>
                    <dd sec:authentication="name">igor_dev</dd>
                </div>
                <div class="profile-card__row">
                    <dt>Дата регистрации</dt>
                    <dd th:text="${@timeFormatter.formatTime(user.createdTime)}">15 января 2026</dd>
                </div>
                <div class="profile-card__row">
                    <dt>Роль</dt>
                    <dd>
                        <span th:insert="fragments.html :: your_roles"></span>
                    </dd>
                </div>
                <div class="profile-card__row">
                    <dt>Личные данные</dt>
                    <dd>Пароль: <a class="link" href="/account/change-password">Изменить пароль</a></dd>
                </div>
            </dl>
        </section>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>
