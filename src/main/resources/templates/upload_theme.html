<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать тему | ITforum.ru</title>

    <!-- Для Spring -->
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/main.css}">

    <!-- Для верстки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../static/main.css">
</head>
<body>

<header class="header">
    <div class="container header-inner">
        <div class="logo">
            <a class="logo-link" href="/" th:href="@{/}">
                <h1>ITforum.ru</h1>
            </a>
        </div>
        <div class="nav-links">
            <a href="/categories">Категории</a>
        </div>
    </div>
</header>

<section class="hero">
    <div class="container">
        <h2>Создание новой темы</h2>
        <p>Заполните форму, чтобы поделиться с сообществом</p>
    </div>
</section>

<div class="container">
    <form class="topic-form" action="/post/upload" method="POST">
        <div class="form-group">
            <label for="category">Выберите раздел</label>
            <select name="category" required>
                <option th:each="entry : ${cats}" th:value="${entry.key}" th:text="${entry.value}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="title">Заголовок</label>
            <input type="text" name="title" placeholder="Например: Проблема с асинхронностью в Python" required>
        </div>

        <div class="form-group">
            <label for="short_desc">Краткое описание</label>
            <input type="text" name="short_desc" placeholder="Коротко о чём тема (1-2 предложения)" required>
        </div>

        <div class="form-group">
            <label for="full_desc">Полное описание</label>
            <textarea name="full_desc" rows="6" placeholder="Подробно опишите вопрос, проблему или идею. Укажите, что уже пробовали сделать, какие ошибки возникают." required></textarea>
        </div>

        <div class="form-group">
            <label for="code">Код</label>
            <textarea name="code" rows="8" placeholder="Вставьте ваш код здесь&#10;Пример:&#10;def hello():&#10;    print('Hello, world!')"></textarea>
            <span class="form-hint">Можно вставить код на любом языке. Необязательное поле.</span>
        </div>

        <div class="form-actions">
            <button type="reset" class="btn-secondary">Очистить</button>
            <button type="submit" class="btn-secondary">Опубликовать тему</button>
        </div>
    </form>
</div>

<footer class="footer">
    <div class="container">
        <div class="copyright">
            © 2026 ITforum.ru | Все права защищены.
        </div>
    </div>
</footer>

</body>
</html>
