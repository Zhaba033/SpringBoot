<!DOCTYPE html>
<html lang="ru">

<head th:replace="fragments.html :: head(title='Создать тему')"></head>

<body>

    <header th:insert="fragments.html :: header"></header>

    <section class="hero">
        <div class="container">
            <h2>Создание новой темы</h2>
            <p>Заполните форму, чтобы поделиться с сообществом</p>
        </div>
    </section>

    <div th:insert="fragments.html :: banned(text='Вы не можете создавать посты, будучи в бане.')"></div>

    <div th:insert="fragments.html :: register(text='Чтобы загружать посты.')"></div>

    <div sec:authorize="hasRole('ROLE_USER')" class="container">
        <form class="topic-form" th:action="@{/theme_upload}" method="POST">
            <div class="form-group">
                <label for="category">Выберите категорию</label>
                <select name="category" required>
                    <option th:each="entry : ${cats}" th:value="${entry.key}" th:text="${entry.value}"></option>
                </select>
            </div>

            <input type="hidden" name="author" th:value="${#authentication.name}">

            <div class="form-group">
                <label for="title">Заголовок</label>
                <input type="text" name="title" placeholder="" required>
            </div>

            <div class="form-group">
                <label for="body">Основная часть</label>
                <textarea name="body" placeholder="" rows="8" required></textarea>
            </div>

            <div class="form-group">
                <label for="code">Код</label>
                <textarea name="code" rows="8"
                    placeholder="Вставьте ваш код здесь&#10;Пример:&#10;def hello():&#10;    print('Hello, world!')"></textarea>
                <span class="form-hint">Можно вставить код на любом языке. Необязательное поле.</span>
            </div>

            <div class="form-actions">
                <button type="reset" class="btn-secondary">Очистить</button>
                <button type="submit" class="btn-secondary">Опубликовать тему</button>
            </div>
        </form>
    </div>

    <footer th:insert="fragments.html :: footer"></footer>

</body>

</html>
